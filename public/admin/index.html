<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyDesk · Einform Server</title><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/app.js"></script></head>
