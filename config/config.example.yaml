server:
  host: 0.0.0.0
  port: 8066
  baseUrl: http://localhost:8066
  timezone: Asia/Shanghai
admin:
  username: admin
  password: change-me
  sessionSecret: auto-generated-on-first-start
  sessionHours: 12
  loginMaxAttempts: 10
  loginWindowSeconds: 900
qweather:
  provider: mock # mock | qweather
  apiHost: ''
  apiKey: ''
  timeoutMs: 8000
  airIndex: cn-mee
location:
  name: 上海
  latitude: 31.23
  longitude: 121.47
weather:
  ttlSeconds:
    now: 1800
    hourly: 1800
    daily: 3600
    air: 1800
    alerts: 600
    geo: 86400
  retrySeconds: 60
render:
  defaultProfile: portrait
  profileDir: ./config/profiles
  cacheDir: ./cache/render
  fontRegular: ./assets/fonts/NotoSansCJKsc-Regular.otf
  fontBold: ./assets/fonts/NotoSansCJKsc-Bold.otf
  retentionDays: 3
  generation:
    enabled: true
    intervalSeconds: 1800
    adaptive: true
    checkSeconds: 30
device:
  heartbeatTimeoutSeconds: 180
  lowBatteryThreshold: 15
  refreshIntervalSeconds: 300
  statusCheckSeconds: 30
discovery:
  enabled: true
  serviceName: EasySmart-Core
commands:
  ttlSeconds: 86400
  retentionSeconds: 604800
  maxPendingPerDevice: 100
storage:
  dataDir: ./data
  cacheDir: ./cache
  logDir: ./logs
logging:
  retentionDays: 14
  maxFileBytes: 5242880
  backups: 2
  recentLimit: 200
  console: true
